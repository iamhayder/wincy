name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly published queries reach existing code rather than only new commits.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    name: Analyse C#
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          # Buildless analysis: the project targets Windows and WPF, which this runner
          # cannot compile. Scanning the sources directly keeps the job simple and means
          # a CodeQL failure can never be caused by the build.
          build-mode: none
          queries: security-and-quality

      - name: Analyse
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:csharp
