name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Wincy is a WPF app: it can be *built* anywhere, but the tests exercise
    # code in a Windows-targeted assembly, so the whole job runs on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  publish:
    name: Publish a single-file executable
    runs-on: windows-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish src/Wincy/Wincy.csproj -c Release -o publish

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: Wincy
          path: publish/Wincy.exe
          if-no-files-found: error
