name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Wincy is a WPF app: it can be *built* anywhere, but the tests exercise
    # code in a Windows-targeted assembly, so the whole job runs on Windows.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  package:
    name: Package the executable and installer
    runs-on: windows-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The runtime identifier belongs on this command, not in the project file:
      # see the comment in Wincy.csproj.
      - name: Publish the portable executable
        run: >
          dotnet publish src/Wincy/Wincy.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o publish

      # Built on every push, not only at release time, so a broken installer is
      # caught here rather than when tagging.
      - name: Build the installer
        run: >
          dotnet build installer/Wincy.Installer.wixproj
          -c Release
          -p:WincyExe=${{ github.workspace }}\publish\Wincy.exe
          -o installer/out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Wincy
          path: |
            publish/Wincy.exe
            installer/out/Wincy.msi
          if-no-files-found: error
